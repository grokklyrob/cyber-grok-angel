<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethereal Model Viewer</title>
  <!--
    ============================================================
    HOW TO USE
    ============================================================
    1. Place ethereal_model.glb next to this file (same folder),
       OR set MODEL_URL below to your path / CDN URL.
    2. Local: serve the folder (required for GLB fetch), e.g.
         npx serve .
         python3 -m http.server 8080
       Then open http://localhost:8080 (or the serve port).
    3. Vercel: deploy this folder with ethereal_model.glb inside.
       MODEL_URL can stay "./ethereal_model.glb".

    Controls:
      • Drag  — free omni-directional orbit
      • Scroll — zoom
      • Right-drag / two-finger — pan
      • UI buttons — reset, play/pause animation, particles on/off
    ============================================================
  -->
  <style>
    :root {
      --bg0: #070810;
      --bg1: #121528;
      --text: #e8eef8;
      --muted: rgba(220, 230, 255, 0.55);
      --glass: rgba(18, 24, 48, 0.45);
      --border: rgba(180, 200, 255, 0.18);
      --accent: #9ecbff;
      --accent2: #c9a8ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 30%, #141a32 0%, #070810 70%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
    }

    canvas { display: block; width: 100%; height: 100%; }

    /* Soft vignette overlay for atmosphere */
    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 40%, rgba(4, 6, 14, 0.55) 100%);
      z-index: 2;
    }

    .ui {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 1.5rem;
      transform: translateX(-50%);
      display: flex;
      gap: 0.55rem;
      padding: 0.55rem 0.7rem;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .ui button {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
      white-space: nowrap;
    }

    .ui button:hover {
      background: rgba(158, 203, 255, 0.12);
      border-color: var(--border);
    }

    .ui button.active {
      background: linear-gradient(135deg, rgba(158, 203, 255, 0.22), rgba(201, 168, 255, 0.18));
      border-color: rgba(180, 200, 255, 0.35);
      color: #fff;
    }

    .title {
      position: fixed;
      z-index: 10;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
    }

    .title h1 {
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status {
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .status.hidden { opacity: 0; }

    .hint {
      position: fixed;
      z-index: 10;
      bottom: 4.4rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: rgba(200, 210, 240, 0.35);
      pointer-events: none;
    }

    @media (max-width: 520px) {
      .ui { flex-wrap: wrap; justify-content: center; max-width: 92vw; border-radius: 1.2rem; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div class="vignette"></div>

  <div class="title"><h1>Ethereal</h1></div>
  <div class="status" id="status">Loading…</div>
  <div class="hint">drag to orbit · scroll to zoom</div>

  <div class="ui">
    <button type="button" id="btn-reset" title="Reset camera">Reset</button>
    <button type="button" id="btn-anim" class="active" title="Play / pause baked animation">Pause</button>
    <button type="button" id="btn-particles" class="active" title="Toggle particle field">Particles</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  /**
   * CONFIG — point this at your GLB
   * Same-folder default works for Vercel + local static servers.
   */
  const MODEL_URL = "./ethereal_model.glb";

  import * as THREE from "three";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
  import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
  import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
  import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

  // ---------- DOM ----------
  const wrap = document.getElementById("canvas-wrap");
  const statusEl = document.getElementById("status");
  const btnReset = document.getElementById("btn-reset");
  const btnAnim = document.getElementById("btn-anim");
  const btnParticles = document.getElementById("btn-particles");

  // ---------- Renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    powerPreference: "high-performance",
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  // Soft ethereal background gradient via fog + clear color
  scene.background = new THREE.Color(0x0a0c16);
  scene.fog = new THREE.FogExp2(0x0a0c16, 0.028);

  const camera = new THREE.PerspectiveCamera(
    42,
    window.innerWidth / window.innerHeight,
    0.05,
    100
  );
  // Defaults updated after the model loads (fit-to-frame)
  const DEFAULT_CAM_POS = new THREE.Vector3(0, 1.2, 7.5);
  const DEFAULT_TARGET = new THREE.Vector3(0, 1.0, 0);
  camera.position.copy(DEFAULT_CAM_POS);

  // Full free orbit (omni-directional)
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = true;
  controls.minDistance = 1.2;
  controls.maxDistance = 18;
  controls.target.copy(DEFAULT_TARGET);
  // No polar angle lock → full free rotation in any direction
  controls.minPolarAngle = 0;
  controls.maxPolarAngle = Math.PI;
  controls.autoRotate = false;

  // Soft ethereal lights (also helps if GLB materials need environment light)
  const hemi = new THREE.HemisphereLight(0xb8c8ff, 0x1a1430, 0.55);
  scene.add(hemi);

  const key = new THREE.DirectionalLight(0xe8f0ff, 1.15);
  key.position.set(3.5, 5.0, 2.5);
  scene.add(key);

  const fill = new THREE.DirectionalLight(0xa8c0ff, 0.45);
  fill.position.set(-4.0, 2.0, -1.5);
  scene.add(fill);

  const rim = new THREE.DirectionalLight(0xc8b0ff, 0.55);
  rim.position.set(0.5, 2.5, -4.0);
  scene.add(rim);

  const under = new THREE.PointLight(0x8866cc, 0.35, 12, 2);
  under.position.set(0, -0.2, 0.5);
  scene.add(under);

  // Soft ambient fill
  scene.add(new THREE.AmbientLight(0x8899cc, 0.18));

  // ---------- Post: mild bloom ----------
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.35, // strength — mild ethereal glow
    0.6,  // radius
    0.72  // threshold
  );
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  // ---------- Particle field (stardust motes) ----------
  const PARTICLE_COUNT = 900;
  const particleGroup = new THREE.Group();
  scene.add(particleGroup);

  // Base positions stored for parallax / swirl reaction
  const basePositions = new Float32Array(PARTICLE_COUNT * 3);
  const phases = new Float32Array(PARTICLE_COUNT);
  const radii = new Float32Array(PARTICLE_COUNT);

  const positions = new Float32Array(PARTICLE_COUNT * 3);
  const colors = new Float32Array(PARTICLE_COUNT * 3);
  const sizes = new Float32Array(PARTICLE_COUNT);

  const colorA = new THREE.Color(0x9ecbff);
  const colorB = new THREE.Color(0xc9a8ff);
  const colorC = new THREE.Color(0xffe0c0);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    // Soft spherical shell / cloud around model
    const u = Math.random();
    const v = Math.random();
    const theta = 2 * Math.PI * u;
    const phi = Math.acos(2 * v - 1);
    const r = 1.8 + Math.pow(Math.random(), 0.65) * 4.2;

    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.sin(phi) * Math.sin(theta) * 0.75 + 1.1;
    const z = r * Math.cos(phi);

    basePositions[i * 3] = x;
    basePositions[i * 3 + 1] = y;
    basePositions[i * 3 + 2] = z;
    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;

    phases[i] = Math.random() * Math.PI * 2;
    radii[i] = r;

    const mix = Math.random();
    const c = mix < 0.45 ? colorA.clone() : mix < 0.8 ? colorB.clone() : colorC.clone();
    // Soft luminance variation
    c.multiplyScalar(0.55 + Math.random() * 0.55);
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;

    sizes[i] = 0.015 + Math.random() * 0.04;
  }

  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  pGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  pGeo.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));

  // Soft circular sprite via canvas texture
  function makeSoftSprite() {
    const size = 64;
    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");
    const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0, "rgba(255,255,255,0.95)");
    g.addColorStop(0.35, "rgba(220,230,255,0.45)");
    g.addColorStop(1, "rgba(180,200,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  const pMat = new THREE.PointsMaterial({
    size: 0.08,
    map: makeSoftSprite(),
    vertexColors: true,
    transparent: true,
    opacity: 0.75,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
  });

  const particles = new THREE.Points(pGeo, pMat);
  particleGroup.add(particles);

  // ---------- Model load ----------
  let modelRoot = null;
  let mixer = null;
  let animPlaying = true;
  let particlesOn = true;
  const clock = new THREE.Clock();

  // Track orbit influence for particle reaction
  const spherical = new THREE.Spherical();
  let prevAzimuth = 0;
  let prevPolar = Math.PI / 2;
  let swirlVelocity = 0;
  let polarVelocity = 0;

  const loader = new GLTFLoader();
  loader.load(
    MODEL_URL,
    (gltf) => {
      modelRoot = gltf.scene;

      // 33% smaller (scale 0.67), true-center, then fit camera so full model is visible
      modelRoot.scale.setScalar(0.67);

      // Soften any overly harsh materials from export (gentle emission clamp)
      modelRoot.traverse((obj) => {
        if (obj.isMesh && obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          for (const m of mats) {
            if (m.emissiveIntensity != null && m.emissiveIntensity > 4) {
              m.emissiveIntensity = 2.5;
            }
            // Slightly soften roughness if present
            if (m.roughness != null) {
              m.roughness = THREE.MathUtils.clamp(m.roughness * 0.95 + 0.05, 0.05, 0.95);
            }
            m.envMapIntensity = 0.6;
            m.needsUpdate = true;
          }
        }
      });

      scene.add(modelRoot);

      // Bounds after scale (must be after scene graph is ready)
      modelRoot.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(modelRoot);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      // Center model on origin so page/orbit focus is true middle
      modelRoot.position.x -= center.x;
      modelRoot.position.y -= center.y;
      modelRoot.position.z -= center.z;
      modelRoot.updateMatrixWorld(true);

      // Orbit target = visual center (origin after centering)
      const targetY = 0;
      controls.target.set(0, targetY, 0);
      DEFAULT_TARGET.set(0, targetY, 0);

      // Fit full model in view with margin (halo / wings not clipped)
      const maxDim = Math.max(size.x, size.y, size.z, 0.001);
      const fov = camera.fov * (Math.PI / 180);
      const fitDist = maxDim / (2 * Math.tan(fov / 2));
      const distance = fitDist * 1.45;
      camera.position.set(distance * 0.55, targetY + maxDim * 0.08, distance * 0.9);
      DEFAULT_CAM_POS.copy(camera.position);
      controls.update();

      if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(modelRoot);
        for (const clip of gltf.animations) {
          const action = mixer.clipAction(clip);
          action.play();
        }
      }

      statusEl.classList.add("hidden");
    },
    (ev) => {
      if (ev.total) {
        const pct = Math.round((ev.loaded / ev.total) * 100);
        statusEl.textContent = `Loading… ${pct}%`;
      }
    },
    (err) => {
      console.error(err);
      statusEl.textContent = "Failed to load model — check MODEL_URL";
      statusEl.style.color = "#ffb0b0";
    }
  );

  // ---------- Particle update linked to orbit ----------
  function updateParticles(dt, t) {
    if (!particlesOn) return;

    // Current camera spherical coords around controls target
    const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
    spherical.setFromVector3(offset);

    const dAz = spherical.theta - prevAzimuth;
    // wrap
    let daz = dAz;
    if (daz > Math.PI) daz -= Math.PI * 2;
    if (daz < -Math.PI) daz += Math.PI * 2;

    const dPol = spherical.phi - prevPolar;
    // Smooth velocities from orbit drag
    swirlVelocity = THREE.MathUtils.damp(swirlVelocity, daz * 18, 4, dt);
    polarVelocity = THREE.MathUtils.damp(polarVelocity, dPol * 12, 4, dt);

    prevAzimuth = spherical.theta;
    prevPolar = spherical.phi;

    // Also gentle idle drift + orbit-reactive swirl
    const posAttr = pGeo.attributes.position;
    const arr = posAttr.array;

    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    // Parallax plane axes
    const right = new THREE.Vector3().crossVectors(camDir, camera.up).normalize();
    const up = new THREE.Vector3().crossVectors(right, camDir).normalize();

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const ix = i * 3;
      const bx = basePositions[ix];
      const by = basePositions[ix + 1];
      const bz = basePositions[ix + 2];
      const ph = phases[i];
      const r = radii[i];

      // Calm float bob
      const bob = Math.sin(t * 0.35 + ph) * 0.06;
      // Slow orbital drift in local base space
      const drift = t * 0.08 + ph;
      const spin = swirlVelocity * (0.4 + r * 0.08);
      const cosS = Math.cos(spin * 0.15 + drift * 0.2);
      const sinS = Math.sin(spin * 0.15 + drift * 0.2);

      // Rotate base XZ by swirl influence (reacts when user orbits)
      let x = bx * cosS - bz * sinS;
      let z = bx * sinS + bz * cosS;
      let y = by + bob + polarVelocity * 0.25 * Math.sin(ph);

      // Subtle parallax: push particles opposite camera motion in view space
      const parallax = 0.12 + r * 0.02;
      x += right.x * swirlVelocity * parallax * 0.15;
      y += up.y * polarVelocity * parallax * 0.2;
      z += right.z * swirlVelocity * parallax * 0.15;

      // Very soft inward breathing
      const breathe = 1 + Math.sin(t * 0.25 + ph) * 0.012;
      arr[ix] = x * breathe;
      arr[ix + 1] = y;
      arr[ix + 2] = z * breathe;
    }
    posAttr.needsUpdate = true;

    // Particle group slowly counter-follows azimuth for linked feel
    particleGroup.rotation.y = THREE.MathUtils.damp(
      particleGroup.rotation.y,
      -spherical.theta * 0.15,
      2.5,
      dt
    );
  }

  // ---------- UI ----------
  btnReset.addEventListener("click", () => {
    camera.position.copy(DEFAULT_CAM_POS);
    controls.target.copy(DEFAULT_TARGET);
    controls.update();
    swirlVelocity = 0;
    polarVelocity = 0;
  });

  btnAnim.addEventListener("click", () => {
    animPlaying = !animPlaying;
    btnAnim.textContent = animPlaying ? "Pause" : "Play";
    btnAnim.classList.toggle("active", animPlaying);
    if (mixer) mixer.timeScale = animPlaying ? 1 : 0;
  });

  btnParticles.addEventListener("click", () => {
    particlesOn = !particlesOn;
    particleGroup.visible = particlesOn;
    btnParticles.classList.toggle("active", particlesOn);
    btnParticles.textContent = "Particles";
  });

  // ---------- Resize ----------
  window.addEventListener("resize", () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
    bloom.setSize(w, h);
  });

  // ---------- Loop ----------
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    controls.update();

    if (mixer && animPlaying) {
      mixer.update(dt);
    }

    updateParticles(dt, t);

    // Extremely subtle camera breathing (does not fight orbit)
    // skipped — keep pure user control

    composer.render();
  }

  animate();
  </script>
</body>
</html>
